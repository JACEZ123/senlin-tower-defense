<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>森林塔防大作战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { height: 100%; background: #0e1410; overflow: hidden; font-family: -apple-system, "PingFang SC", sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  #game { position: absolute; left: 0; top: 0; display: block; }

  /* 顶栏（横屏塔防 HUD） */
  #bar { position: absolute; top: 8px; left: 10px; right: 10px; height: 44px; display: flex; align-items: center; gap: 8px; z-index: 10; pointer-events: none; }
  .pill { background: rgba(20,28,20,.74); color: #ffe9a8; font-size: 16px; font-weight: 800; padding: 6px 14px; border-radius: 999px; border: 2px solid rgba(255,200,90,.5); display: flex; align-items: center; gap: 5px; }
  #waveWrap { flex: 1; max-width: 360px; margin: 0 auto; background: rgba(20,28,20,.7); border: 2px solid rgba(255,200,90,.45); border-radius: 999px; height: 30px; position: relative; overflow: hidden; }
  #waveFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg,#7CFC4D,#3fae2a); transition: width .3s; }
  #waveTxt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .btn-ic { pointer-events: auto; width: 38px; height: 38px; border-radius: 50%; background: rgba(20,28,20,.74); border: 2px solid rgba(255,200,90,.5); color: #ffe9a8; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .spacer { flex: 1; }
  .hud-ic { width: 20px; height: 20px; object-fit: contain; vertical-align: middle; }
  .btn-ic img { width: 22px; height: 22px; object-fit: contain; }
  #speedBtn { gap: 0; } #speedBtn img { width: 16px; height: 16px; } #speedNum { font-size: 13px; font-weight: 800; margin-left: 1px; }
  .pause2 { display: flex; gap: 4px; align-items: center; justify-content: center; }
  .pause2::before, .pause2::after { content: ""; width: 5px; height: 16px; border-radius: 2px; background: #ffe9a8; }

  /* 弹窗（建造/升级/分支） */
  #popup { position: absolute; z-index: 20; background: rgba(22,30,22,.97); border: 2px solid rgba(255,200,90,.55); border-radius: 16px; padding: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.6); display: none; min-width: 260px; }
  #popup .ttl { color: #ffe9a8; font-size: 15px; font-weight: 800; text-align: center; margin-bottom: 8px; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 380px; }
  .card { width: 80px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,200,90,.3); border-radius: 10px; padding: 6px 2px; text-align: center; cursor: pointer; }
  .card.dis { opacity: .4; } .card img { width: 42px; height: 42px; object-fit: contain; }
  .card .nm { color: #ffe9a8; font-size: 12px; } .card .ct { color: #ffd23f; font-size: 12px; font-weight: 700; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .btn { padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 800; color: #fff; cursor: pointer; text-align: center; }
  .btn.up { background: linear-gradient(180deg,#4fc3f7,#1976d2); } .btn.dis { opacity: .4; }
  .btn.brA { background: linear-gradient(180deg,#b08cff,#6a3fd0); } .btn.brB { background: linear-gradient(180deg,#ff9a6a,#d0563f); }
  .btn.sell { background: linear-gradient(180deg,#9ccc65,#558b2f); } .btn.maxed { background: rgba(255,200,100,.25); color: #ffd23f; }
  .sub { color: #cfd8ff; font-size: 11px; margin: 0 0 7px; } .close { color: #c8b89f; font-size: 12px; text-align: center; margin-top: 8px; cursor: pointer; }

  /* 解锁弹窗 (#9) */
  #unlock { position: absolute; inset: 0; z-index: 35; background: rgba(0,0,0,.74); display: none; align-items: center; justify-content: center; }
  #unlock .ucard { background: linear-gradient(180deg,#2a3526,#18211a); border: 2px solid rgba(255,200,90,.6); border-radius: 20px; padding: 22px 30px; text-align: center; max-width: 320px; box-shadow: 0 0 40px rgba(255,210,80,.3); }
  #unlock .uglow { width: 110px; height: 110px; margin: 0 auto 6px; border-radius: 50%; background: radial-gradient(circle,#fff6cf,#ffd23f55 60%,transparent 72%); display: flex; align-items: center; justify-content: center; }
  #unlock .uglow img { width: 92px; height: 92px; object-fit: contain; }
  #unlock .un { color: #fff; font-size: 20px; font-weight: 900; margin-top: 4px; }
  #unlock .ud { color: #c8d8c0; font-size: 13px; margin: 6px 0 14px; }

  /* 选关 / 首页 */
  #menu { position: absolute; inset: 0; z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: center;
          background: radial-gradient(120% 90% at 50% 0%, #2b5a8a, #15324f 60%, #0e2236); overflow-y: auto; padding: 16px; }
  #menu h1 { color: #ffe9a8; font-size: 34px; font-weight: 900; text-shadow: 0 3px 0 #b9742a, 0 5px 8px rgba(0,0,0,.4); margin: 6px 0 2px; letter-spacing: 3px; }
  #menu .logo { max-width: 520px; width: 62%; height: auto; margin: 10px 0 2px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  #menu .sub2 { color: #bcd; font-size: 13px; margin-bottom: 12px; }
  #chapters { display: flex; gap: 8px; margin-bottom: 12px; }
  .chap { padding: 7px 16px; border-radius: 999px; font-weight: 800; font-size: 15px; cursor: pointer; color: #fff; background: rgba(255,255,255,.12); border: 2px solid transparent; }
  .chap.on { background: linear-gradient(180deg,#ffcf5a,#e8941b); border-color: #fff3; color: #3a2400; }
  #lvlGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; max-width: 620px; }
  .lvl { aspect-ratio: 1.3; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; cursor: pointer; border: 2px solid rgba(255,210,120,.4); position: relative; }
  .lvl.open { background: linear-gradient(180deg,#3a6a3a,#244524); color: #eaffd9; }
  .lvl.cleared { background: linear-gradient(180deg,#2e7d4f,#1c5236); color: #d9ffe8; }
  .lvl.locked { background: rgba(255,255,255,.05); color: #6b8; cursor: not-allowed; }
  .lvl .th { font-size: 9px; font-weight: 600; opacity: .85; }
  .lvl .st { position: absolute; top: 3px; right: 5px; font-size: 12px; }
  .lvl .st .stimg { width: 15px; height: 15px; object-fit: contain; display: block; }

  /* 轻量过渡横幅/toast（开场/过关/失败/Boss来袭），非全屏、自动消失 */
  @keyframes bnIn { 0%{opacity:0;transform:translateY(-24px) scale(.9)} 100%{opacity:1;transform:translateY(0) scale(1)} }
  @keyframes bnShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  #banner { position: absolute; left: 0; right: 0; top: 20%; z-index: 50; display: none; justify-content: center; pointer-events: none; }
  #banner .bncard { display: flex; align-items: center; gap: 14px; padding: 12px 26px 12px 14px; border-radius: 18px;
                    background: linear-gradient(180deg,rgba(30,42,28,.96),rgba(18,26,18,.96)); border: 3px solid rgba(255,200,90,.7);
                    box-shadow: 0 12px 40px rgba(0,0,0,.55); animation: bnIn .35s ease-out; max-width: 90vw; }
  #banner #bnGif { width: 150px; height: 88px; object-fit: cover; border-radius: 12px; flex: 0 0 auto; }
  #banner #bnText { color: #ffe066; font-size: 30px; font-weight: 900; letter-spacing: 3px; -webkit-text-stroke: 1.5px #7a3e12; text-shadow: 0 3px 0 #7a3e12; white-space: nowrap; }
  #banner.boss .bncard { border-color: #ff5a4d; background: linear-gradient(180deg,rgba(60,20,18,.96),rgba(30,10,10,.96)); animation: bnIn .35s ease-out, bnShake .5s ease-in-out .35s 2; }
  #banner.boss #bnText { color: #ff6a5a; -webkit-text-stroke: 1.5px #5a1410; text-shadow: 0 3px 0 #5a1410; }
  #banner.win .bncard { border-color: #ffd23f; }
  #banner.lose .bncard { border-color: #9aa6b0; background: linear-gradient(180deg,rgba(40,44,48,.96),rgba(22,26,30,.96)); }
  #banner.lose #bnText { color: #d5dde5; -webkit-text-stroke: 1.5px #2a3038; text-shadow: 0 3px 0 #2a3038; }

  /* ===== 设计稿动画 ===== */
  @keyframes wtbob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  @keyframes wtfloat { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-13px) rotate(3deg)} }
  @keyframes wtshim { 0%{transform:translateX(-160%)} 100%{transform:translateX(420%)} }
  @keyframes wtpulse { 0%,100%{box-shadow:0 5px 0 #2f5f16,0 0 0 0 rgba(124,252,77,.55)} 50%{box-shadow:0 5px 0 #2f5f16,0 0 0 13px rgba(124,252,77,0)} }
  @keyframes wtdot { 0%,80%,100%{opacity:.25;transform:translateY(0)} 40%{opacity:1;transform:translateY(-3px)} }

  /* ===== 启动加载页（等待页） ===== */
  #loading { position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
             background: #1b3a24 center/cover no-repeat; overflow: hidden; }
  #loading::after { content:""; position:absolute; inset:0; background: linear-gradient(180deg,rgba(10,25,15,.15),rgba(8,20,12,.55)); }
  #loading > * { position: relative; z-index: 1; }
  #loading .mascot { width: 120px; height: 120px; object-fit: contain; animation: wtbob 2.6s ease-in-out infinite; filter: drop-shadow(0 6px 8px rgba(0,0,0,.45)); }
  #loading .ldlogo { width: 60%; max-width: 460px; height: auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  #loading .ldsub { color: #e7f0d8; font-size: 14px; font-weight: 700; letter-spacing: 2px; opacity: .92; }
  #loading .ldbar { margin-top: 6px; width: min(520px,74vw); padding: 9px; border-radius: 22px; background: linear-gradient(#7a4a1c,#5a3410); border: 2px solid #b9742a; box-shadow: 0 5px 12px rgba(0,0,0,.4); }
  #loading .ldtrack { position: relative; height: 28px; border-radius: 14px; background: #2a1c0e; overflow: hidden; }
  #loading .ldfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 14px; background: linear-gradient(#8dfc5c,#3fae2a); box-shadow: inset 0 2px 3px rgba(255,255,255,.35); transition: width .25s; }
  #loading .ldshim { position: absolute; top: 0; bottom: 0; width: 70px; background: linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent); animation: wtshim 1.6s linear infinite; }
  #loading .ldpct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #loading .ldtip { color: #ffe9a8; font-size: 13px; font-weight: 700; }
  #loading .lddots { display: flex; align-items: center; gap: 5px; color: #dfe8d0; font-size: 13px; font-weight: 700; }
  #loading .lddots i { animation: wtdot 1.2s infinite; font-style: normal; }
  #loading .ldver { position: absolute; left: 16px; bottom: 12px; z-index: 1; font-size: 12px; color: rgba(255,255,255,.55); font-weight: 700; }

  /* ===== 选关页·蜿蜒地图 ===== */
  #menu.mapmode { justify-content: flex-start; padding: 0; overflow: hidden; }
  #mapTop { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: linear-gradient(rgba(8,20,12,.5),transparent); }
  #mapTop .mtitle { color: #ffe066; font-size: 22px; font-weight: 900; text-shadow: 0 2px 0 #7a3e12; -webkit-text-stroke: 1px #7a3e12; }
  #mapTop .mprog { display: flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 999px; background: rgba(20,28,20,.74); border: 2px solid rgba(255,200,90,.55); color: #ffe9a8; font-size: 14px; font-weight: 800; }
  #chapters { display: flex; gap: 8px; position: absolute; top: 60px; left: 0; right: 0; z-index: 3; justify-content: center; flex-wrap: wrap; padding: 0 12px; margin: 0; }
  .chap { padding: 9px 16px; font-weight: 800; font-size: 13px; cursor: pointer; color: #6a4418; background-image: url(assets/ui_btn_wood.png); background-size: 100% 100%; background-repeat: no-repeat; border: none; white-space: nowrap; filter: drop-shadow(0 3px 4px rgba(0,0,0,.3)); }
  .chap.on { background-image: url(assets/ui_btn_gold.png); color: #5a3410; }
  .chap.lock { opacity: .55; filter: grayscale(.5); cursor: not-allowed; }
  #mapArea { position: absolute; inset: 0; z-index: 1; background: #1b3a24 center/cover no-repeat; }
  #mapArea::after { content:""; position:absolute; inset:0; background: linear-gradient(180deg,rgba(8,20,12,.5),rgba(8,20,12,.15) 35%,rgba(8,20,12,.45)); }
  #mapSvg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
  .node { position: absolute; z-index: 3; width: 74px; height: 74px; transform: translate(-50%,-50%); cursor: pointer; }
  .node .disc { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff3d0; display: grid; place-items: center; font-size: 28px; font-weight: 900; }
  .node.cleared .disc { background: linear-gradient(#ffd868,#e0912a); color: #6b3d10; box-shadow: 0 5px 0 #9c5f1f,0 8px 14px rgba(0,0,0,.4); }
  .node.current .disc { background: linear-gradient(#a6e05a,#4e9c26); color: #1d3f0d; border-color: #eaffcf; animation: wtpulse 1.8s infinite; }
  .node.locked { cursor: not-allowed; }
  .node.locked .disc { background: linear-gradient(#8a94a0,#59626d); color: #cfd6dd; border-color: #cfd6dd; box-shadow: 0 5px 0 #3d444d,0 8px 14px rgba(0,0,0,.4); }
  .node .stars { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); display: flex; gap: 1px; }
  .node .stars img { width: 14px; height: 14px; object-fit: contain; }
  .node .badge { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); padding: 2px 9px; border-radius: 8px; background: #3fae2a; border: 2px solid #eaffcf; color: #fff; font-size: 10px; font-weight: 900; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,.35); }
  .node .lk { width: 30px; height: 30px; object-fit: contain; }
  #mapCta { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 3; padding: 11px 34px; border-radius: 18px; background: linear-gradient(#ffd868,#f2a531); border: 3px solid #b9742a; box-shadow: 0 5px 0 #9c5f1f,0 9px 16px rgba(0,0,0,.35); color: #5a3410; font-size: 20px; font-weight: 900; cursor: pointer; }
  #mapBack { position: absolute; left: 16px; bottom: 18px; z-index: 3; width: 48px; height: 48px; background: url(assets/ic_back.png) center/contain no-repeat; border: none; color: transparent; font-size: 0; cursor: pointer; filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)); }

  /* ===== 设置 / 暂停面板 ===== */
  #settings { position: absolute; inset: 0; z-index: 45; display: none; align-items: center; justify-content: center; background: rgba(6,14,9,.62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  #settings .scard { width: 440px; max-width: 90vw; border-radius: 26px; background: linear-gradient(#2e3d26,#1b271a); border: 3px solid rgba(255,200,90,.6); box-shadow: 0 24px 60px rgba(0,0,0,.6); padding: 24px 28px 26px; position: relative; }
  #settings .sclose { position: absolute; right: 14px; top: 14px; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.35); border: 1.5px solid rgba(255,255,255,.25); color: #fff; font-size: 16px; display: grid; place-items: center; cursor: pointer; }
  #settings .stitle { text-align: center; color: #ffe066; font-size: 28px; font-weight: 900; -webkit-text-stroke: 1.5px #7a3e12; text-shadow: 0 3px 0 #7a3e12; }
  #settings .ssub { text-align: center; color: #9fcf9a; font-size: 13px; font-weight: 700; margin-top: 2px; }
  #settings .stog { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  #settings .srow { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 14px; background: rgba(10,18,10,.5); border: 2px solid rgba(255,200,90,.3); }
  #settings .srow .lbl { display: flex; align-items: center; gap: 10px; color: #e8f0e0; font-size: 16px; font-weight: 800; }
  #settings .sw { width: 56px; height: 30px; border-radius: 999px; position: relative; cursor: pointer; background: rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.15); transition: background .15s; }
  #settings .sw .knob { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #c9d2da; box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: left .15s,background .15s; }
  #settings .sw.on { background: linear-gradient(#8dfc5c,#3fae2a); border-color: #2f5f16; }
  #settings .sw.on .knob { left: 30px; background: #fff; }
  #settings .sbtns { margin-top: 18px; display: flex; flex-direction: column; gap: 11px; }
  #settings .sbig { padding: 15px; border-radius: 18px; background: linear-gradient(#a6e05a,#4e9c26); border: 3px solid #3d7a1c; box-shadow: 0 6px 0 #2f5f16,0 10px 18px rgba(0,0,0,.35); text-align: center; color: #1d3f0d; font-size: 24px; font-weight: 900; cursor: pointer; }
  #settings .srowbtn { display: flex; gap: 11px; }
  #settings .srowbtn > div { flex: 1; padding: 12px; border-radius: 16px; text-align: center; font-size: 18px; font-weight: 800; cursor: pointer; }
  #settings .sreplay { background: linear-gradient(#7ad4f7,#2f8fd0); border: 3px solid #1e6aa8; box-shadow: 0 5px 0 #14507f; color: #0d3b5e; }
  #settings .shome { background: rgba(20,28,20,.72); border: 2px solid rgba(255,200,90,.5); color: #ffe9a8; }

  /* ===== 首页（入口） ===== */
  #home { position: absolute; inset: 0; z-index: 42; display: none; background: #1b3a24 url(assets/bg_home.png) center/cover no-repeat; }
  #home::after { content:""; position:absolute; inset:0; background: linear-gradient(90deg,rgba(8,20,12,.10),rgba(8,20,12,0) 34%,rgba(8,20,12,.30) 66%,rgba(8,20,12,.52)); }
  #homeBar { position: absolute; top: 12px; left: 14px; z-index: 2; display: flex; gap: 10px; }
  #homeMain { position: absolute; inset: 56px 48px 26px; z-index: 2; display: flex; align-items: center; justify-content: space-between; }
  .hleft { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
  .hleft .hlogo { width: 360px; max-width: 42vw; filter: drop-shadow(0 5px 0 #7a3e12) drop-shadow(0 8px 12px rgba(0,0,0,.45)); }
  .hleft .htag { padding: 5px 14px; border-radius: 999px; background: rgba(20,28,20,.55); border: 1px solid rgba(255,200,90,.4); font-size: 13px; color: #ffe9a8; font-weight: 700; }
  .hleft .hmascot { display: none; }
  .hright { display: flex; flex-direction: column; gap: 14px; width: 300px; }
  .hbtn { text-align: center; cursor: pointer; font-weight: 900; background-size: 100% 100%; background-repeat: no-repeat; filter: drop-shadow(0 5px 6px rgba(0,0,0,.35)); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hbtn.hstart { padding: 24px 16px; font-size: 28px; color: #5a3410; background-image: url(assets/ui_btn_gold.png); }
  .hbtn.hcont { padding: 20px 12px; font-size: 22px; color: #1e4d12; background-image: url(assets/ui_btn_green.png); }
  .hbtn.hcont .hsub { font-size: 12px; color: #235016; font-weight: 800; margin-top: 2px; }
  .hbtn.hlevels { padding: 20px 12px; font-size: 22px; color: #0b3350; background-image: url(assets/ui_btn_blue.png); }
  .hrow3 { display: flex; gap: 10px; }
  .hmini { flex: 1; padding: 8px 0 6px; text-align: center; font-size: 14px; font-weight: 800; color: #4a2b08; background: url(assets/ui_btn_wood.png) center/100% 100% no-repeat; cursor: pointer; filter: drop-shadow(0 4px 5px rgba(0,0,0,.3)); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .hmini img { width: 26px; height: 26px; object-fit: contain; }

  /* ===== 通用二级页（商店/图鉴） ===== */
  .page { position: absolute; inset: 0; z-index: 43; display: none; background: radial-gradient(120% 100% at 50% 0%,#2f5233,#1c3320 58%,#112417); }
  .pgbar { position: absolute; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 2; }
  .pgback { width: 46px; height: 46px; background: url(assets/ic_back.png) center/contain no-repeat; border: none; color: transparent; font-size: 0; cursor: pointer; filter: drop-shadow(0 3px 4px rgba(0,0,0,.4)); }
  .pgtitle { position: absolute; left: 0; right: 0; text-align: center; color: #ffe066; font-size: 24px; font-weight: 900; -webkit-text-stroke: 1.5px #7a3e12; text-shadow: 0 2px 0 #7a3e12; pointer-events: none; }
  .pgbody { position: absolute; inset: 62px 20px 18px; display: flex; gap: 16px; }

  /* 商店 */
  .shopPreview { width: 322px; flex: 0 0 auto; border-radius: 20px; background: rgba(8,16,10,.55); border: 2px solid rgba(255,200,90,.4); padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .shopPreview .spname { font-size: 12px; color: #9fcf9a; font-weight: 700; letter-spacing: 1px; }
  .shopPreview .sptitle { font-size: 24px; color: #ffe066; }
  .shopPreview .spimg { width: 170px; height: 160px; object-fit: contain; filter: drop-shadow(0 0 26px rgba(176,140,255,.35)); }
  .shopPreview .spdesc { font-size: 12px; color: #cfe0d0; font-weight: 600; text-align: center; line-height: 1.5; }
  .shopPreview .spbuy { margin-top: auto; width: 100%; padding: 17px 13px; background-image: url(assets/ui_btn_gold.png); background-size: 100% 100%; background-repeat: no-repeat; border: none; text-align: center; color: #5a3410; font-size: 20px; font-weight: 900; cursor: pointer; filter: drop-shadow(0 4px 5px rgba(0,0,0,.3)); }
  .shopPreview .spbuy.e { background-image: url(assets/ui_btn_green.png); color: #1e4d12; }
  .shopPreview .spbuy.q { background-image: url(assets/ui_btn_blue.png); color: #0b3350; }
  .shopRight { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .shopChars { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .shopChar { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 14px; background: rgba(10,18,10,.55); border: 2px solid rgba(255,200,90,.3); display: grid; place-items: center; cursor: pointer; }
  .shopChar.on { border-color: #ffd23f; box-shadow: 0 0 0 3px rgba(255,210,63,.2); background: rgba(176,140,255,.14); }
  .shopChar img { width: 44px; height: 44px; object-fit: contain; }
  .shopGrid { flex: 1; display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; align-content: start; overflow-y: auto; }
  .skin .skthumb { width: 62px; height: 62px; object-fit: contain; }
  .skin { border-radius: 16px; background: rgba(8,16,10,.45); border: 2px solid rgba(255,200,90,.28); padding: 11px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .skin.sel { border-color: #ffd23f; box-shadow: 0 0 0 3px rgba(255,210,63,.2); background: rgba(176,140,255,.14); }
  .skin img { width: 62px; height: 62px; object-fit: contain; }
  .skin .sknm { font-size: 12px; color: #e8f0e0; font-weight: 800; text-align: center; }
  .skin .sktag { padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; }
  .sktag.eq { background: #3fae2a; color: #fff; } .sktag.own { background: rgba(255,255,255,.14); color: #cfd6dd; } .sktag.buy { background: rgba(255,210,63,.2); border: 1px solid rgba(255,200,90,.7); color: #ffe9a8; }

  /* 图鉴 */
  .dexDetail { width: 322px; flex: 0 0 auto; border-radius: 20px; background: rgba(8,16,10,.55); border: 2px solid rgba(255,200,90,.4); padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; overflow-y: auto; }
  .dexDetail .dxcat { align-self: flex-start; font-size: 12px; color: #9fcf9a; font-weight: 700; }
  .dexDetail .dxname { font-size: 24px; color: #ffe066; }
  .dexDetail .dxtags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .dexDetail .dxtags span { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; background: rgba(124,252,77,.16); border: 1px solid rgba(124,252,77,.5); color: #b8f5a0; }
  .dexDetail .dxevo { display: flex; align-items: center; gap: 5px; }
  .dexDetail .dxevo img { width: 54px; height: 54px; object-fit: contain; background: rgba(0,0,0,.2); border-radius: 12px; }
  .dexDetail .dxevo span { color: #ffe9a8; font-size: 15px; }
  .dexDetail .dxstats { width: 100%; display: flex; flex-direction: column; gap: 6px; margin: 4px 0 2px; }
  .dexDetail .dxstat { display: flex; align-items: center; gap: 8px; }
  .dexDetail .dxstat .sl { display: flex; align-items: center; gap: 4px; width: 62px; font-size: 12px; color: #cfe0d0; font-weight: 700; }
  .dexDetail .dxstat .sl img { width: 15px; height: 15px; object-fit: contain; }
  .dexDetail .dxstat .sbarwrap { flex: 1; height: 9px; border-radius: 6px; background: rgba(0,0,0,.35); overflow: hidden; }
  .dexDetail .dxstat .sbar { height: 100%; border-radius: 6px; }
  .dexDetail .dxstat .sv { width: 42px; text-align: right; font-size: 12px; color: #ffe9a8; font-weight: 800; }
  .dexDetail .dxdesc { font-size: 12px; color: #b9cbb6; font-weight: 600; text-align: center; line-height: 1.55; }
  .dexRight { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .dexTabs { display: flex; gap: 8px; }
  .dxtab { padding: 10px 20px; font-size: 13px; font-weight: 900; cursor: pointer; background-image: url(assets/ui_btn_wood.png); background-size: 100% 100%; background-repeat: no-repeat; border: none; color: #6a4418; filter: drop-shadow(0 3px 4px rgba(0,0,0,.3)); }
  .dxtab.on { background-image: url(assets/ui_btn_gold.png); color: #5a3410; }
  .dexGrid { flex: 1; display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; align-content: start; overflow-y: auto; }
  .dexcell { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
  .dexcell .dc { width: 62px; height: 62px; border-radius: 18px; background: rgba(10,18,10,.5); border: 2px solid rgba(255,255,255,.18); display: grid; place-items: center; overflow: hidden; }
  .dexcell.sel .dc { border-color: #ffe066; box-shadow: 0 0 0 3px rgba(255,210,63,.2); }
  .dexcell .dc img { width: 56px; height: 56px; object-fit: contain; }
  .dexcell.lock .dc { color: #7a8690; font-size: 26px; font-weight: 900; }
  .dexcell .dcn { font-size: 11px; color: #cfe0d0; font-weight: 700; }

  #overlay { position: absolute; inset: 0; background: rgba(0,0,0,.7); z-index: 30; display: none; align-items: center; justify-content: center; }
  #overlay .box { background: rgba(22,30,22,.98); border: 2px solid rgba(255,200,90,.55); border-radius: 18px; padding: 22px 32px; text-align: center; }
  #overlay .t { color: #ffe9a8; font-size: 24px; font-weight: 900; } #overlay .s { color: #c8b89f; font-size: 13px; margin: 8px 0 14px; }
  .ovic { width: 28px; height: 28px; object-fit: contain; vertical-align: middle; }
  /* Boss 来袭红色警报（屏幕四周红光脉冲） */
  #bossAlarm { position: absolute; inset: 0; z-index: 49; pointer-events: none; display: none; box-shadow: inset 0 0 120px 30px rgba(220,30,30,.72), inset 0 0 40px 8px rgba(255,80,60,.55); }
  #bossAlarm.on { display: block; animation: bossPulse 0.55s ease-in-out 3; }
  @keyframes bossPulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  #chestNum { position: absolute; right: -4px; top: -4px; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 9px; background: #f2a531; color: #4a2b08; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  #chestBtn { position: relative; }
  /* 宝箱开启揭示卡 */
  #chestReveal { position: absolute; inset: 0; z-index: 52; display: none; align-items: center; justify-content: center; pointer-events: none; }
  #chestReveal .crCard { position: relative; width: 260px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: crPop .5s cubic-bezier(.2,1.4,.4,1); }
  #chestReveal .crFrame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 20px rgba(0,0,0,.5)); }
  #chestReveal .crItem { width: 132px; height: 132px; object-fit: contain; margin-top: -18px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.45)); animation: wtfloat 2.4s ease-in-out infinite; }
  #chestReveal .crName { color: #fff; font-size: 22px; font-weight: 900; -webkit-text-stroke: 1px #5a3410; text-shadow: 0 2px 0 #5a3410; margin-top: 8px; }
  #chestReveal .crDesc { color: #ffe9a8; font-size: 13px; font-weight: 700; margin-top: 4px; padding: 0 30px; text-align: center; }
  @keyframes crPop { 0% { transform: scale(.3) rotate(-8deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  /* 宝箱购买弹窗 */
  #chestBuy { position: absolute; inset: 0; background: rgba(0,0,0,.7); z-index: 46; display: none; align-items: center; justify-content: center; }
  #chestBuy .box { background: rgba(22,30,22,.98); border: 2px solid rgba(255,200,90,.55); border-radius: 18px; padding: 22px 30px; text-align: center; max-width: 320px; }
  #chestBuy .t { color: #ffe9a8; font-size: 22px; font-weight: 900; } #chestBuy .s { color: #c8b89f; font-size: 13px; margin: 8px 0 14px; }
  #chestBuy .btn { cursor: pointer; }
  /* 新手引导 */
  #tut { position: absolute; inset: 0; z-index: 55; display: none; pointer-events: none; }
  #tut .tutSign { pointer-events: auto; }
  #tut .tutMask { position: absolute; inset: 0; background: rgba(4,10,6,.62); display: none; }
  #tut .tutHole { position: absolute; border-radius: 50%; border: 3px solid #ffd23f; background: radial-gradient(circle, rgba(255,238,170,.34), rgba(255,238,170,0) 72%); box-shadow: 0 0 22px 6px rgba(255,210,90,.55); display: none; pointer-events: none; animation: wtpulse 1.4s ease-in-out infinite; }
  #tut .tutHand { position: absolute; width: 52px; height: 52px; object-fit: contain; display: none; pointer-events: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); animation: wtbob 1s ease-in-out infinite; }
  #tut .tutSign { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); width: 460px; max-width: 88vw; min-height: 118px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 34px; }
  #tut .tutBoard { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; z-index: 0; }
  #tut .tutTxt { position: relative; z-index: 1; color: #4a2b08; font-size: 17px; font-weight: 800; text-align: center; line-height: 1.5; text-shadow: 0 1px 0 rgba(255,240,200,.4); }
  #tut .tutBtn { position: relative; z-index: 1; margin-top: 12px; padding: 7px 26px; border-radius: 14px; background: linear-gradient(#ffd868,#f2a531); border: 2px solid #b9742a; box-shadow: 0 3px 0 #9c5f1f; color: #5a3410; font-size: 15px; font-weight: 900; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="bar">
    <div class="pill"><img class="hud-ic" src="assets/ic_coin.png" alt=""> <span id="gold">0</span></div>
    <div id="waveWrap"><div id="waveFill"></div><div id="waveTxt">0/0 波</div></div>
    <div class="btn-ic" id="speedBtn"><img src="assets/ic_speed.png" alt=""><span id="speedNum">1</span></div>
    <div class="btn-ic" id="startBtn"><img id="playIco" src="assets/ic_play.png" alt="继续" style="display:none"><span id="pauseIco" class="pause2"></span></div>
    <div class="btn-ic" id="chestBtn" style="display:none"><img src="assets/chest_closed.png" alt="宝箱" onerror="this.style.display='none'"><span id="chestNum">0</span></div>
    <div class="btn-ic" id="menuBtn"><img src="assets/ic_menu.png" alt="菜单"></div>
  </div>
  <div id="popup"></div>
  <div id="bossAlarm"></div>
  <div id="banner"><div class="bncard"><img id="bnGif" alt="" onerror="this.style.display='none'"><div id="bnText"></div></div></div>
  <div id="unlock"><div class="ucard"><div class="uglow"><img id="uImg"></div><div class="un" id="uName"></div><div class="ud" id="uDesc"></div><div class="btn up" id="uOk" style="display:inline-block">知道了</div></div></div>
  <div id="overlay"><div class="box"><div class="t" id="ovT"></div><div class="s" id="ovS"></div><div class="row"><div class="btn up" id="ovNext">下一关</div><div class="btn sell" id="ovReplay">重玩</div><div class="btn" style="background:#557" id="ovMenu">选关</div></div></div></div>
  <!-- 宝箱开启揭示卡 -->
  <div id="chestReveal"><div class="crCard" id="crCard"><img class="crFrame" id="crFrame" onerror="this.style.display='none'"><img class="crItem" id="crItem" onerror="this.style.display='none'"><div class="crName" id="crName"></div><div class="crDesc" id="crDesc"></div></div></div>
  <!-- 宝箱不足：钻石购买 / 看广告(预留) -->
  <div id="chestBuy"><div class="box">
    <div class="t"><img class="ovic" src="assets/chest_closed.png" onerror="this.style.display='none'"> 获取宝箱</div>
    <div class="s">宝箱可像塔一样放置，开出随机增益</div>
    <div class="row" style="flex-direction:column;gap:10px">
      <div class="btn up" id="cbBuy"><img class="hud-ic" src="assets/ic_gem.png" onerror="this.style.display='none'"> 20 钻 换 1 个宝箱</div>
      <div class="btn" id="cbAd" style="background:#557;opacity:.6">看广告 +1（接入微信后开放）</div>
      <div class="btn sell" id="cbClose">关闭</div>
    </div>
  </div></div>
  <!-- 新手引导：遮罩 + 高亮镂空 + 木牌提示 + 手指 -->
  <div id="tut">
    <div class="tutMask" id="tutMask"></div>
    <div class="tutHole" id="tutHole"></div>
    <img class="tutHand" id="tutHand" src="assets/ic_hand.png" onerror="this.style.display='none'">
    <div class="tutSign" id="tutSign">
      <img class="tutBoard" src="assets/sign_wood.png" onerror="this.style.display='none'">
      <div class="tutTxt" id="tutTxt"></div>
      <div class="tutBtn" id="tutNext">下一步</div>
    </div>
  </div>
  <div id="menu" class="mapmode">
    <div id="mapArea"></div>
    <svg id="mapSvg" viewBox="0 0 1280 720" preserveAspectRatio="none"><path id="mapPath" fill="none" stroke="#ffe9a8" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 24" opacity="0.6"></path></svg>
    <div id="mapTop">
      <div class="mtitle" id="mapTitle">翠绿草原</div>
      <div class="mprog"><img class="hud-ic" src="assets/ic_star.png" alt=""> <span id="mapCleared">0</span>/40</div>
    </div>
    <div id="chapters"></div>
    <div id="mapNodes"></div>
    <div id="mapBack">←</div>
    <div id="mapCta">进入 第 1 关 →</div>
  </div>

  <!-- 设置 / 暂停面板 -->
  <div id="settings">
    <div class="scard">
      <div class="sclose" id="setClose">×</div>
      <div class="stitle" id="setTitle">游戏暂停</div>
      <div class="ssub" id="setSub">第 1 关 · 翠绿草原</div>
      <div class="stog">
        <div class="srow"><div class="lbl"><img src="assets/ic_music.png" onerror="this.style.display='none'" style="width:22px;height:22px;object-fit:contain">音乐</div><div class="sw on" id="swMusic"><div class="knob"></div></div></div>
        <div class="srow"><div class="lbl"><img src="assets/ic_sfx.png" onerror="this.style.display='none'" style="width:22px;height:22px;object-fit:contain">音效</div><div class="sw on" id="swSfx"><div class="knob"></div></div></div>
      </div>
      <div class="sbtns">
        <div class="sbig" id="setResume">继续游戏</div>
        <div class="srowbtn" id="setRowBtn">
          <div class="sreplay" id="setReplay">重玩本关</div>
          <div class="shome" id="setHome">返回选关</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 首页（入口） -->
  <div id="home">
    <div id="homeBar">
      <div class="pill"><img class="hud-ic" src="assets/ic_gem.png" alt="钻石" onerror="this.style.display='none'"> <span id="homeGems">0</span></div>
    </div>
    <div id="homeMain">
      <div class="hleft">
        <img class="hlogo" src="assets/logo_title.png" alt="森林塔防大作战" onerror="this.style.display='none'">
        <div class="htag">40 关塔防 · 8 大主题世界</div>
        <img class="hmascot" src="assets/tw_arrow_1.png" alt="" onerror="this.style.display='none'">
      </div>
      <div class="hright">
        <div class="hbtn hstart" id="hStart">开始游戏</div>
        <div class="hbtn hcont" id="hCont">继续冒险<div class="hsub" id="hContSub">上次进度 · 第 1 关</div></div>
        <div class="hbtn hlevels" id="hLevels">关卡选择</div>
        <div class="hrow3"><div class="hmini" id="hCodex"><img src="assets/ic_codex.png" onerror="this.style.display='none'">图鉴</div><div class="hmini" id="hShop"><img src="assets/ic_shop.png" onerror="this.style.display='none'">商店</div><div class="hmini" id="hSet"><img src="assets/ic_gear.png" onerror="this.style.display='none'">设置</div></div>
      </div>
    </div>
  </div>

  <!-- 商店（皮肤） -->
  <div id="shop" class="page">
    <div class="pgbar"><div class="pgback" id="shopBack">←</div><div class="pgtitle">商店 · 皮肤</div><div class="pill"><img class="hud-ic" src="assets/ic_gem.png" alt="钻石" onerror="this.style.display='none'"> <span id="shopGems">0</span></div></div>
    <div class="pgbody">
      <div class="shopPreview" id="shopPreview"></div>
      <div class="shopRight"><div class="shopChars" id="shopChars"></div><div class="shopGrid" id="shopGrid"></div></div>
    </div>
  </div>

  <!-- 图鉴 -->
  <div id="codex" class="page">
    <div class="pgbar"><div class="pgback" id="dexBack">←</div><div class="pgtitle">图鉴</div><div class="pill" id="dexCount">已收集 8 / 24</div></div>
    <div class="pgbody">
      <div class="dexDetail" id="dexDetail"></div>
      <div class="dexRight"><div class="dexTabs" id="dexTabs"></div><div class="dexGrid" id="dexGrid"></div></div>
    </div>
  </div>

  <!-- 启动加载页（等待页） -->
  <div id="loading">
    <img class="mascot" src="assets/tw_arrow_1.png" alt="" onerror="this.style.display='none'">
    <img class="ldlogo" src="assets/logo_title.png" alt="森林塔防大作战" onerror="this.style.display='none'">
    <div class="ldsub">40 关塔防 · 8 大主题世界</div>
    <div class="ldbar"><div class="ldtrack"><div class="ldfill" id="ldFill"></div><div class="ldshim"></div><div class="ldpct" id="ldPct">0%</div></div></div>
    <div class="ldtip"><img src="assets/ic_tip.png" onerror="this.style.display='none'" style="width:18px;height:18px;object-fit:contain;vertical-align:middle;margin-right:4px">小提示 · 满级守卫可二选一专精分支</div>
    <div class="lddots">加载资源中<i>●</i><i style="animation-delay:.2s">●</i><i style="animation-delay:.4s">●</i></div>
    <div class="ldver">v1.0.0</div>
  </div>
</div>
<script src="main.js"></script>
</body>
</html>
