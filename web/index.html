<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>森林塔防大作战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { height: 100%; background: #0e1410; overflow: hidden; font-family: -apple-system, "PingFang SC", sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  #game { position: absolute; left: 0; top: 0; display: block; }

  /* 顶栏（横屏塔防 HUD） */
  #bar { position: absolute; top: 8px; left: 10px; right: 10px; height: 44px; display: flex; align-items: center; gap: 8px; z-index: 10; pointer-events: none; }
  .pill { background: rgba(20,28,20,.74); color: #ffe9a8; font-size: 16px; font-weight: 800; padding: 6px 14px; border-radius: 999px; border: 2px solid rgba(255,200,90,.5); display: flex; align-items: center; gap: 5px; }
  #waveWrap { flex: 1; max-width: 360px; margin: 0 auto; background: rgba(20,28,20,.7); border: 2px solid rgba(255,200,90,.45); border-radius: 999px; height: 30px; position: relative; overflow: hidden; }
  #waveFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg,#7CFC4D,#3fae2a); transition: width .3s; }
  #waveTxt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .btn-ic { pointer-events: auto; width: 38px; height: 38px; border-radius: 50%; background: rgba(20,28,20,.74); border: 2px solid rgba(255,200,90,.5); color: #ffe9a8; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .spacer { flex: 1; }
  .hud-ic { width: 20px; height: 20px; object-fit: contain; vertical-align: middle; }
  .btn-ic img { width: 22px; height: 22px; object-fit: contain; }
  #speedBtn { gap: 0; } #speedBtn img { width: 16px; height: 16px; } #speedNum { font-size: 13px; font-weight: 800; margin-left: 1px; }

  /* 弹窗（建造/升级/分支） */
  #popup { position: absolute; z-index: 20; background: rgba(22,30,22,.97); border: 2px solid rgba(255,200,90,.55); border-radius: 16px; padding: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.6); display: none; min-width: 260px; }
  #popup .ttl { color: #ffe9a8; font-size: 15px; font-weight: 800; text-align: center; margin-bottom: 8px; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 380px; }
  .card { width: 80px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,200,90,.3); border-radius: 10px; padding: 6px 2px; text-align: center; cursor: pointer; }
  .card.dis { opacity: .4; } .card img { width: 42px; height: 42px; object-fit: contain; }
  .card .nm { color: #ffe9a8; font-size: 12px; } .card .ct { color: #ffd23f; font-size: 12px; font-weight: 700; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .btn { padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 800; color: #fff; cursor: pointer; text-align: center; }
  .btn.up { background: linear-gradient(180deg,#4fc3f7,#1976d2); } .btn.dis { opacity: .4; }
  .btn.brA { background: linear-gradient(180deg,#b08cff,#6a3fd0); } .btn.brB { background: linear-gradient(180deg,#ff9a6a,#d0563f); }
  .btn.sell { background: linear-gradient(180deg,#9ccc65,#558b2f); } .btn.maxed { background: rgba(255,200,100,.25); color: #ffd23f; }
  .sub { color: #cfd8ff; font-size: 11px; margin: 0 0 7px; } .close { color: #c8b89f; font-size: 12px; text-align: center; margin-top: 8px; cursor: pointer; }

  /* 解锁弹窗 (#9) */
  #unlock { position: absolute; inset: 0; z-index: 35; background: rgba(0,0,0,.74); display: none; align-items: center; justify-content: center; }
  #unlock .ucard { background: linear-gradient(180deg,#2a3526,#18211a); border: 2px solid rgba(255,200,90,.6); border-radius: 20px; padding: 22px 30px; text-align: center; max-width: 320px; box-shadow: 0 0 40px rgba(255,210,80,.3); }
  #unlock .uglow { width: 110px; height: 110px; margin: 0 auto 6px; border-radius: 50%; background: radial-gradient(circle,#fff6cf,#ffd23f55 60%,transparent 72%); display: flex; align-items: center; justify-content: center; }
  #unlock .uglow img { width: 92px; height: 92px; object-fit: contain; }
  #unlock .un { color: #fff; font-size: 20px; font-weight: 900; margin-top: 4px; }
  #unlock .ud { color: #c8d8c0; font-size: 13px; margin: 6px 0 14px; }

  /* 选关 / 首页 */
  #menu { position: absolute; inset: 0; z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: center;
          background: radial-gradient(120% 90% at 50% 0%, #2b5a8a, #15324f 60%, #0e2236); overflow-y: auto; padding: 16px; }
  #menu h1 { color: #ffe9a8; font-size: 34px; font-weight: 900; text-shadow: 0 3px 0 #b9742a, 0 5px 8px rgba(0,0,0,.4); margin: 6px 0 2px; letter-spacing: 3px; }
  #menu .logo { max-width: 520px; width: 62%; height: auto; margin: 10px 0 2px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  #menu .sub2 { color: #bcd; font-size: 13px; margin-bottom: 12px; }
  #chapters { display: flex; gap: 8px; margin-bottom: 12px; }
  .chap { padding: 7px 16px; border-radius: 999px; font-weight: 800; font-size: 15px; cursor: pointer; color: #fff; background: rgba(255,255,255,.12); border: 2px solid transparent; }
  .chap.on { background: linear-gradient(180deg,#ffcf5a,#e8941b); border-color: #fff3; color: #3a2400; }
  #lvlGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; max-width: 620px; }
  .lvl { aspect-ratio: 1.3; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; cursor: pointer; border: 2px solid rgba(255,210,120,.4); position: relative; }
  .lvl.open { background: linear-gradient(180deg,#3a6a3a,#244524); color: #eaffd9; }
  .lvl.cleared { background: linear-gradient(180deg,#2e7d4f,#1c5236); color: #d9ffe8; }
  .lvl.locked { background: rgba(255,255,255,.05); color: #6b8; cursor: not-allowed; }
  .lvl .th { font-size: 9px; font-weight: 600; opacity: .85; }
  .lvl .st { position: absolute; top: 3px; right: 5px; font-size: 12px; }
  .lvl .st .stimg { width: 15px; height: 15px; object-fit: contain; display: block; }

  /* 过场视频叠层（开场/胜利/失败/Boss来袭） */
  #cut { position: absolute; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: #000; }
  #cutVid { width: 100%; height: 100%; object-fit: cover; }
  #cutSkip { position: absolute; right: 16px; bottom: 14px; z-index: 51; padding: 7px 16px; border-radius: 999px; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.4); color: #fff; font-size: 13px; font-weight: 800; cursor: pointer; }
  #cutTag { position: absolute; left: 0; right: 0; top: 12%; z-index: 51; text-align: center; color: #fff; font-size: 34px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 3px 8px rgba(0,0,0,.8); pointer-events: none; }

  #overlay { position: absolute; inset: 0; background: rgba(0,0,0,.7); z-index: 30; display: none; align-items: center; justify-content: center; }
  #overlay .box { background: rgba(22,30,22,.98); border: 2px solid rgba(255,200,90,.55); border-radius: 18px; padding: 22px 32px; text-align: center; }
  #overlay .t { color: #ffe9a8; font-size: 24px; font-weight: 900; } #overlay .s { color: #c8b89f; font-size: 13px; margin: 8px 0 14px; }
  .ovic { width: 28px; height: 28px; object-fit: contain; vertical-align: middle; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="bar">
    <div class="pill"><img class="hud-ic" src="assets/ic_coin.png" alt=""> <span id="gold">0</span></div>
    <div id="waveWrap"><div id="waveFill"></div><div id="waveTxt">0/0 波</div></div>
    <div class="btn-ic" id="speedBtn"><img src="assets/ic_speed.png" alt=""><span id="speedNum">1</span></div>
    <div class="btn-ic" id="startBtn"><img src="assets/ic_play.png" alt="出怪"></div>
    <div class="btn-ic" id="menuBtn"><img src="assets/ic_menu.png" alt="菜单"></div>
  </div>
  <div id="popup"></div>
  <div id="cut"><video id="cutVid" playsinline muted preload="auto"></video><div id="cutTag"></div><div id="cutSkip">跳过</div></div>
  <div id="unlock"><div class="ucard"><div class="uglow"><img id="uImg"></div><div class="un" id="uName"></div><div class="ud" id="uDesc"></div><div class="btn up" id="uOk" style="display:inline-block">知道了</div></div></div>
  <div id="overlay"><div class="box"><div class="t" id="ovT"></div><div class="s" id="ovS"></div><div class="row"><div class="btn up" id="ovNext">下一关</div><div class="btn sell" id="ovReplay">重玩</div><div class="btn" style="background:#557" id="ovMenu">选关</div></div></div></div>
  <div id="menu">
    <img id="logo" class="logo" src="assets/logo_title.png" alt="森林塔防大作战" onerror="this.style.display='none';document.getElementById('logoTxt').style.display='block'">
    <h1 id="logoTxt" style="display:none">森林塔防大作战</h1>
    <div class="sub2">40关塔防 · 逐关解锁守卫与技能 · 英雄于第40关登场</div>
    <div id="chapters"></div><div id="lvlGrid"></div>
  </div>
</div>
<script src="main.js"></script>
</body>
</html>
